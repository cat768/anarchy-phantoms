name: AnarchyPhantoms
version: '1.0.0'
main: com.anarchyphantoms.phantomcontrol.AnarchyPhantomsPlugin
api-version: '1.21'
description: Actively spawns phantoms in The End (endstone/chorus surfaces only), passive until attacked, silent screech until provoked.
author: AnarchyPhantoms
folia-supported: true

commands:
  anarchyphantoms:
    description: AnarchyPhantoms admin/version commands.
    usage: /anarchyphantoms help | ver | git [info <hash>|history [page]] | reload | debug <on|off>
    aliases: [ap]

permissions:
  anarchyphantoms.admin:
    description: Allows use of AnarchyPhantoms admin commands.
    default: op
  anarchyphantoms.debug:
    description: Receive AnarchyPhantoms debug lines (spawns, aggro changes) in chat while debug mode is on. Independent of anarchyphantoms.admin.
    default: op