name: AnarchyPhantoms
version: '1.0.0'
main: com.anarchyphantoms.phantomcontrol.AnarchyPhantomsPlugin
api-version: '1.21'
description: Actively spawns phantoms in The End (endstone/chorus surfaces only), passive until attacked, silent screech until provoked.
author: AnarchyPhantoms
folia-supported: true

commands:
  anarchyphantoms:
    description: Reloads the AnarchyPhantoms plugin configuration.
    usage: /anarchyphantoms reload
    permission: anarchyphantoms.admin
    aliases: [ap]

permissions:
  anarchyphantoms.admin:
    description: Allows use of AnarchyPhantoms admin commands.
    default: op
