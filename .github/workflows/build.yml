name: Build

# Builds a jar on every push, names it anarchy-phantoms-git-<short-sha>.jar
# (7-char short SHA, same format GitHub shows in the commit list/UI), then
# smoke-tests that single jar against every Paper AND Folia version (at or
# below the plugin's compile target) that currently has a STABLE build.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish/update the "latest" release below

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
      jar_name: ${{ steps.jar.outputs.name }}
      latest_name: ${{ steps.jar.outputs.latest_name }}
      target_mc_version: ${{ steps.target.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B clean package

      # The target Minecraft/Paper version this plugin is developed and
      # compiled against, read straight out of pom.xml so it never drifts
      # out of sync with the actual paper-api dependency version. Smoke
      # tests (both Paper and Folia) walk backwards from this version, same
      # reasoning as before: newer calendar-versioned MC releases can need a
      # newer JDK than this plugin is compiled/targeted for.
      - name: Read target MC version from pom.xml
        id: target
        run: |
          set -euo pipefail
          # Pull the paper-api <version> straight out of the POM text (e.g.
          # "1.21.9-R0.1-SNAPSHOT" -> "1.21.9") rather than depend on extra
          # Maven plugins just to read one value.
          VERSION=$(grep -A2 '<artifactId>paper-api</artifactId>' pom.xml \
            | grep '<version>' | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' \
            | sed -E 's/-R0\.1-SNAPSHOT$//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine target MC version from pom.xml's paper-api dependency"
            exit 1
          fi
          echo "Target MC version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename jar
        id: jar
        run: |
          set -euo pipefail
          src="$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          if [ -z "$src" ]; then
            echo "No built jar found in target/" >&2
            exit 1
          fi
          name="anarchy-phantoms-git-${{ steps.sha.outputs.short }}.jar"
          cp "$src" "target/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=target/$name" >> "$GITHUB_OUTPUT"

          # A second, sha-agnostic copy for the rolling "latest" release.
          # Keeping this name stable (rather than sha-suffixed) means the
          # download URL under the "latest" release never changes between
          # builds - only the file's contents do.
          latest_name="anarchy-phantoms-latest.jar"
          cp "$src" "target/$latest_name"
          echo "latest_name=$latest_name" >> "$GITHUB_OUTPUT"
          echo "latest_path=target/$latest_name" >> "$GITHUB_OUTPUT"

      # The jar is the one and only build artifact smoke-tested below. It's
      # compiled against paper-api ONLY (see pom.xml) - there is no separate
      # Folia-API compile. This relies on Paper/Folia API compatibility at
      # the Bukkit/Paper plugin API surface, which holds for this plugin
      # since it does nothing region-threading-specific (no
      # RegionScheduler/GlobalRegionScheduler usage - see
      # PhantomSoundListener.java's comment). If the plugin ever starts
      # using Folia's region schedulers directly, this single-jar approach
      # stops being valid and a Folia-specific compile would be needed.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      # Publish each commit's jar to its own permanent, per-commit release
      # so historical builds stay downloadable by sha after "latest" below
      # moves on. clean: false (the default) is fine here since each of
      # these tags/releases is only ever written to once.
      - name: Publish per-commit release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: git-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: |
            Automated build from commit ${{ github.sha }}.
            This is a permanent, immutable release for this specific commit.
          prerelease: true
          make_latest: false
          files: ${{ steps.jar.outputs.path }}

      # Also publish to a rolling "latest" GitHub Release so there's a
      # stable, linkable download URL that always points at the newest jar.
      #
      # clean: true wipes any assets left over from a previous run before
      # uploading the new one - without this, softprops/action-gh-release
      # only appends, so every build's jar piled up on this one release
      # instead of the tag actually being replaced.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build (${{ steps.sha.outputs.short }})
          body: |
            Automated build from commit ${{ github.sha }}.
            This tag/release is overwritten on every push to `main` - only
            the newest jar is kept here. For older builds, see the
            per-commit `git-<sha>` releases.
          prerelease: true
          make_latest: false
          clean: true
          files: ${{ steps.jar.outputs.latest_path }}

  discover-versions:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      # Dynamically queries Fill for BOTH Paper and Folia at CI runtime, and
      # only includes {server_type, mc_version} pairs that currently have a
      # STABLE build. Folia lags Paper (fewer versions, starts later) - this
      # is discovered from the live API response, never hardcoded, so the
      # matrix self-adjusts as PaperMC ships new stable builds for either
      # project without needing a workflow edit.
      - name: Discover stable Paper + Folia versions
        id: discover
        env:
          TARGET_MC_VERSION: ${{ needs.build.outputs.target_mc_version }}
        run: |
          set -uo pipefail
          UA="anarchy-phantoms-ci/1.0 (https://github.com/${{ github.repository }})"

          fetch_stable_versions() {
            local project="$1"
            local versions
            versions=$(curl -sf -H "User-Agent: $UA" "https://fill.papermc.io/v3/projects/${project}" \
              | jq -r '.versions | to_entries[] | .value[]' | sort -V -r)
            [ -n "$versions" ] || return 0

            # Only ever consider TARGET_MC_VERSION and older - never chase a
            # newer major line (see build job's comment on why).
            local candidates
            candidates=$(printf '%s\n' "$versions" | awk -v t="$TARGET_MC_VERSION" '
              $0==t {found=1}
              found {print}
            ')
            [ -n "$candidates" ] || return 0

            for v in $candidates; do
              local builds url
              builds=$(curl -sf -H "User-Agent: $UA" \
                "https://fill.papermc.io/v3/projects/${project}/versions/${v}/builds") || continue
              url=$(echo "$builds" | jq -r \
                'map(select(.channel == "STABLE")) | .[0].downloads."server:default".url // empty')
              if [ -n "$url" ]; then
                jq -n --arg p "$project" --arg v "$v" '{server_type: $p, mc_version: $v}'
              fi
            done
          }

          MATRIX_JSON=$( { fetch_stable_versions paper; fetch_stable_versions folia; } | jq -s -c '{include: .}' )

          COUNT=$(echo "$MATRIX_JSON" | jq '.include | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No stable Paper or Folia builds found at or below $TARGET_MC_VERSION"
            exit 1
          fi

          echo "Discovered $COUNT smoke-test legs:"
          echo "$MATRIX_JSON" | jq .
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  smoke-test:
    runs-on: ubuntu-latest
    needs: [build, discover-versions]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.jar_name }}
          path: dist

      # Boots a real Paper or Folia server (per matrix.server_type) with the
      # freshly built jar dropped into plugins/, and checks that the plugin
      # actually loads/enables rather than just compiling. Fails the job
      # (with the plugin's own error printed) if it doesn't.
      #
      # This is the SAME jar for both server types - it's compiled against
      # paper-api only, relying on Paper/Folia API compatibility (see the
      # build job's comment on why that's valid for this plugin today).
      - name: Smoke test on ${{ matrix.server_type }} ${{ matrix.mc_version }}
        id: smoke
        env:
          SERVER_TYPE: ${{ matrix.server_type }}
          MC_VERSION: ${{ matrix.mc_version }}
          JAR_PATH: dist/${{ needs.build.outputs.jar_name }}
        run: |
          set -uo pipefail

          run_smoke_test() {
          UA="anarchy-phantoms-ci/1.0 (https://github.com/${{ github.repository }})"
          WORKDIR="$RUNNER_TEMP/${SERVER_TYPE}-smoketest"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/plugins"

          echo "::group::Resolving stable $SERVER_TYPE build for $MC_VERSION"

          # discover-versions already confirmed a STABLE build exists for
          # this exact (server_type, mc_version) pair, so this just
          # re-resolves the download URL rather than walking backwards
          # again - no version fallback needed here, unlike the discovery
          # step which had to search for candidates.
          BUILDS=$(curl -sf -H "User-Agent: $UA" \
            "https://fill.papermc.io/v3/projects/${SERVER_TYPE}/versions/${MC_VERSION}/builds")
          DOWNLOAD_URL=$(echo "$BUILDS" | jq -r \
            'map(select(.channel == "STABLE")) | .[0].downloads."server:default".url // empty')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::No stable $SERVER_TYPE build found for $MC_VERSION (was available during discovery but not now - build may have been pulled)"
            return 1
          fi

          echo "Using $SERVER_TYPE $MC_VERSION"
          echo "Downloading: $DOWNLOAD_URL"
          curl -sfL -H "User-Agent: $UA" -o "$WORKDIR/server.jar" "$DOWNLOAD_URL"
          echo "::endgroup::"

          cp "$JAR_PATH" "$WORKDIR/plugins/"
          echo "eula=true" > "$WORKDIR/eula.txt"
          # Headless/offline settings so the server boots without a real
          # network/account context and shuts down cleanly on its own.
          #
          # level-type is "void" (a single-layer superflat with no blocks)
          # rather than a normal flat grass world: this is the cheapest
          # possible world to generate/light, which matters a lot on
          # shared CI hardware where world-gen is what was blowing the
          # timeout, not plugin code. generator-settings explicitly
          # defines a single air layer so we're not relying on an
          # implicit default.
          #
          # generate-structures/spawn-npcs/spawn-monsters are all off to
          # skip structure placement and extra entity/AI setup work that
          # isn't needed just to confirm the plugin enables cleanly.
          {
            echo "online-mode=false"
            echo "server-port=25599"
            echo "level-type=minecraft:flat"
            echo 'generator-settings={"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void"}'
            echo "generate-structures=false"
            echo "spawn-npcs=false"
            echo "spawn-monsters=false"
            echo "spawn-protection=0"
            echo "view-distance=3"
            echo "simulation-distance=3"
          } > "$WORKDIR/server.properties"

          echo "::group::Starting $SERVER_TYPE server"
          cd "$WORKDIR"
          # Stream the log to the job's own stdout live (tail -F in the
          # background) so if the server dies before writing much to disk,
          # we still see what happened in the Actions log itself rather than
          # only getting a truncated logs/latest.log after the fact.
          mkdir -p logs
          touch logs/latest.log
          tail -n +1 -F logs/latest.log &
          TAIL_PID=$!

          # The watcher loop below needs to see "Done"/error lines the
          # moment they're printed. logs/latest.log is written by Paper's
          # (and Folia's, same log4j2 base) RollingRandomAccessFile
          # appender, which buffers/flushes on its own schedule - NOT
          # synchronously per line - so under CI contention the console can
          # show "Done" well before those same bytes land on disk. console.log
          # instead captures the JVM's raw stdout directly via `tee`, with
          # no log4j buffering in between, so a line is visible to the
          # watcher the instant the process writes it.
          touch console.log

          # Feed "stop" after boot via a background watcher instead of relying
          # solely on a timeout, so we get a clean shutdown log when possible.
          #
          # Heap raised to 4G (public-repo runners have 4 vCPU/16GB, so this
          # is safe headroom) and -XX:ActiveProcessorCount is pinned because
          # G1GC's auto-detected thread count can be wrong under the
          # runner's cgroup, which slows world-gen enough to blow a tight
          # timeout even when there's no real OOM. -Xms is set to 2G
          # (rather than 1G) so the heap doesn't have to grow mid-boot on a
          # contended host, which was adding avoidable delay right when
          # startup is most timing-sensitive.
          #
          # Folia boots more threads (per-region) than Paper by design, so
          # the same headroom/timeout budget is kept generous for both
          # rather than tightened for Paper specifically.
          WATCH_SECS=600
          TIMEOUT_SECS=630
          (
            for _ in $(seq 1 "$WATCH_SECS"); do
              if grep -qE '^\[[0-9:]+ INFO\]: Done \(' console.log 2>/dev/null \
                 || grep -qE '\*\*\*.*could not be loaded|Error occurred while enabling|disabled due to' console.log 2>/dev/null; then
                sleep 2
                echo "stop"
                break
              fi
              sleep 1
            done
          ) | timeout "$TIMEOUT_SECS" java -Xmx4G -Xms2G \
                -XX:ActiveProcessorCount=4 \
                -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 \
                -jar server.jar --nogui \
                2>&1 | tee console.log \
            || true

          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::Server log"
          cat logs/latest.log 2>/dev/null || echo "(no log produced)"
          echo "::endgroup::"

          # Verdict is read from console.log, not logs/latest.log, for the
          # same reason the watcher above uses it: the log4j2 appender
          # buffers/flushes on its own schedule, so logs/latest.log can
          # still be missing "Done" on disk even though the server printed
          # it and shut down cleanly. Checking the buffered file here
          # reintroduces the exact "stalled boot" failure the watcher was
          # already fixed to avoid. console.log (captured via `tee` on the
          # JVM's raw stdout) is the same source of truth the watcher
          # trusted to send "stop", so the pass/fail check must trust it too.
          LOG="console.log"
          if [ ! -f "$LOG" ] || [ ! -s "$LOG" ]; then
            echo "::error::Server produced no console output at all — it likely failed to start."
            return 1
          fi

          PLUGIN_NAME="AnarchyPhantoms"
          FAILED=0
          # STALL_ONLY stays 1 only if every failure found below is the
          # "never reached Done, but plugin did log output" case with no
          # other error signature present - i.e. a pure slow/stalled boot.
          # Any concrete plugin error (JVM crash, enable failure, plugin
          # never loaded at all) flips this to 0, since retrying won't fix
          # a real bug.
          STALL_ONLY=1

          # Check for a JVM-level death (OOM, crash) before assuming this is
          # a plugin problem — these produce a tiny log with no plugin
          # output at all, which otherwise looks confusingly like the
          # plugin never got a chance to load.
          if grep -qiE "java\.lang\.OutOfMemoryError|A fatal error has been detected by the Java Runtime Environment|Could not reserve enough space" "$LOG"; then
            echo "::error::The JVM itself crashed or ran out of heap before the server finished starting (not a plugin error). Consider raising -Xmx further."
            FAILED=1
            STALL_ONLY=0
          fi

          LOG_SIZE=$(wc -c < "$LOG")
          if [ "$LOG_SIZE" -lt 500 ]; then
            echo "::warning::$LOG is only ${LOG_SIZE} bytes — the server likely died very early (before most logging even started), independent of plugin code."
          fi

          if grep -qE "Error occurred while enabling $PLUGIN_NAME" "$LOG" \
             || grep -qE "Could not load '.*${{ needs.build.outputs.jar_name }}'" "$LOG" \
             || grep -qE "$PLUGIN_NAME.*disabled due to" "$LOG"; then
            echo "::error::Plugin failed to enable. See extracted error below."
            FAILED=1
            STALL_ONLY=0
          fi

          if ! grep -qE "\[$PLUGIN_NAME\] Enabling $PLUGIN_NAME" "$LOG"; then
            echo "::error::Never saw '[$PLUGIN_NAME] Enabling $PLUGIN_NAME' in the log — plugin was not loaded by the server."
            FAILED=1
            STALL_ONLY=0
          fi

          if ! grep -qE '^\[[0-9:]+ INFO\]: Done \(' "$LOG"; then
            if grep -qi "$PLUGIN_NAME" "$LOG"; then
              echo "::error::Server never reached 'Done', but $PLUGIN_NAME did log output — this looks like a slow/stalled boot (world-gen, GC, or CI resource contention) rather than a plugin crash. See the log tail below."
            else
              echo "::error::Server never reached 'Done' and never logged anything about $PLUGIN_NAME — it did not finish starting, independent of the plugin."
              STALL_ONLY=0
            fi
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "## ❌ Plugin smoke test failed on $SERVER_TYPE $MC_VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            RELEVANT=$(awk '/\[AnarchyPhantoms\]|Error occurred while enabling|Caused by:|\tat /' "$LOG" | tail -n 100)
            if [ -n "$RELEVANT" ]; then
              printf '%s\n' "$RELEVANT" >> "$GITHUB_STEP_SUMMARY"
            else
              tail -n 100 "$LOG" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "$STALL_ONLY" -eq 1 ]; then
              return 2
            fi
            return 1
          fi

          echo "## ✅ Plugin loaded and enabled successfully on $SERVER_TYPE $MC_VERSION" >> "$GITHUB_STEP_SUMMARY"
          }

          ATTEMPTS=2
          STATUS=0
          for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
            echo "::group::Smoke test attempt $ATTEMPT/$ATTEMPTS ($SERVER_TYPE $MC_VERSION)"
            run_smoke_test
            STATUS=$?
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              break
            fi
            if [ "$STATUS" -eq 2 ] && [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              echo "::warning::Attempt $ATTEMPT looked like a CI stall (server never reached 'Done', no concrete plugin error) rather than a plugin bug. Retrying once before failing the job."
              continue
            fi
            break
          done
          exit "$STATUS"

      # Logs are uploaded regardless of pass/fail so you can inspect a
      # failure from the Actions UI without re-running anything. Both files
      # are included: console.log is what the pass/fail verdict is actually
      # based on (see the smoke test step), while logs/latest.log is the
      # server's own formatted log and easier to read by eye.
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.server_type }}-smoketest-log-${{ matrix.mc_version }}-${{ needs.build.outputs.short_sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.server_type }}-smoketest/logs/latest.log
            ${{ runner.temp }}/${{ matrix.server_type }}-smoketest/console.log
          if-no-files-found: ignore