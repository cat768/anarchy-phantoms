name: Build

# Runs a fast MockBukkit/JUnit behavioral test suite first (unit-test),
# gating everything else. On push to main / workflow_dispatch, it then
# compiles the jar once and smoke-tests it against every supported Paper
# AND Folia version (>= MIN_MC_VERSION) that currently has a STABLE build,
# discovered at runtime from PaperMC's Fill API. Publishing only happens if
# every leg of the smoke-test matrix passes. On a pull_request, only
# unit-test runs (see the `if:` on every other job) - PRs get fast
# behavioral feedback without spending CI time on the full boot-matrix or
# attempting to cut a release from an unmerged head.
#
# Paper 1.21.9 is additionally pinned (always included in the Paper leg,
# independent of Fill discovery) since it's this plugin's actual production
# target. Unlike every other version in the matrix, 1.21.9 never had a
# STABLE build at all (PaperMC's Fill data shows it as ALPHA-only, marked
# unsupported since 07/10/2025, superseded by 1.21.10 same cycle) - so its
# leg is smoke-tested against the best available ALPHA build instead. See
# PINNED_PAPER_VERSIONS in generate-matrix.sh for details.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# On a pull_request event, only the fast `unit-test` job runs (see each
# job's own `if:` condition below) - the compile/boot-matrix/publish
# pipeline stays push-to-main/workflow_dispatch only, exactly as before.
# This keeps PR feedback fast (behavioral tests only, ~1 minute) without
# spending CI minutes booting real servers or attempting to cut a release
# from an unmerged PR head on every push to a branch.

env:
  # Floor for the smoke-test matrix. Only this version and newer are
  # considered, for both Paper and Folia — versions below this are never
  # smoke-tested even if Fill reports a stable build for them. Bump this
  # when you intentionally drop support for older MC versions.
  MIN_MC_VERSION: "1.21.9"

permissions:
  contents: write # needed to publish/update the "latest" release below

jobs:
  # ---------------------------------------------------------------------
  # 0. Fast behavioral unit tests (MockBukkit + JUnit 5). Runs BEFORE the
  #    compile-and-boot pipeline below and gates it: `build` now depends on
  #    this job passing first. This is deliberately the fastest job in the
  #    whole workflow (no server download, no world boot, no Fill API
  #    calls) so a broken phantom-behavior rule (spawn veto, provocation,
  #    silence) fails in ~1 minute instead of only being caught - or, as
  #    was previously the case, NOT caught at all - by the boot-only smoke
  #    tests further down, which only ever proved the jar loads without
  #    crashing.
  #
  #    Runs on every push to main AND every PR into main (see `on:` above),
  #    unlike the boot-matrix which only runs on push/dispatch - so a PR
  #    gets fast feedback on behavior correctness without needing to spin
  #    up the full Paper/Folia matrix.
  # ---------------------------------------------------------------------
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs src/test/java (MockBukkit-based behavioral tests) without
      # packaging the jar or running the git-info/git-history generator
      # plugins - `test` is an earlier lifecycle phase than `package`, and
      # none of the assertions here depend on the final jar's contents.
      - name: Run unit tests
        run: mvn -B test

      # Surefire's XML reports, published as a real GitHub Checks summary
      # so pass/fail per-test is visible in the PR UI, not just buried in
      # raw log output.
      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'target/surefire-reports/TEST-*.xml'
          require_tests: true
          fail_on_failure: true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # 1. Compile once. No server-type/version axis here at all: the plugin
  #    is compiled against paper-api only (see pom.xml) and relies on
  #    Paper/Folia API compatibility + `folia-supported: true` in
  #    plugin.yml — the SAME jar is smoke-tested against both server
  #    types below, rather than doing a second Maven build against
  #    dev.folia:folia-api. If that ever stops being true (e.g. the
  #    plugin needs a Folia-only API call), this job is where a second
  #    build variant would need to be added.
  # ---------------------------------------------------------------------
  build:
    needs: [unit-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
      jar_name: ${{ steps.jar.outputs.name }}
      jar_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Default fetch-depth: 1 (shallow) would leave git-commit-id-maven-plugin
          # fine (it only needs HEAD) but would silently truncate
          # scripts/export-git-history.sh's `git log -25` down to a single
          # commit, breaking "/ap git history" paging. 30 gives the 25-commit
          # export a small margin; bump this if MAX history entries increases.
          fetch-depth: 30

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Rename jar
        id: jar
        run: |
          set -euo pipefail
          src="$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          if [ -z "$src" ]; then
            echo "No built jar found in target/" >&2
            exit 1
          fi
          name="anarchy-phantoms-git-${{ steps.sha.outputs.short }}.jar"
          cp "$src" "target/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=target/$name" >> "$GITHUB_OUTPUT"

      # Digest is computed here, immediately after the jar exists and BEFORE
      # any smoke-test leg touches it, so the hash always describes exactly
      # the bytes that get smoke-tested and (if every leg passes) published.
      # The plugin's own updater (PluginUpdater#downloadVerifyAndStage)
      # downloads this .sha256 file alongside the jar and refuses to stage
      # anything whose recomputed digest doesn't match - this is the actual
      # integrity check; "only CI-passed commits have a release to find"
      # alone is not one, since it says nothing about whether the downloaded
      # bytes are intact or genuine.
      - name: Compute jar digest
        id: digest
        run: |
          set -euo pipefail
          sum="$(sha256sum "${{ steps.jar.outputs.path }}" | awk '{print $1}')"
          echo "$sum" > "${{ steps.jar.outputs.path }}.sha256"
          echo "path=${{ steps.jar.outputs.path }}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Digest: $sum"

      # Uploaded once here; every smoke-test matrix leg downloads this same
      # artifact rather than each rebuilding it themselves. The digest file
      # travels with it so smoke-test legs could (if ever needed) verify
      # they're booting the exact bytes `build` produced.
      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ steps.sha.outputs.short }}
          path: |
            ${{ steps.jar.outputs.path }}
            ${{ steps.digest.outputs.path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 2. Discover the version matrix at runtime. Queries Fill for both Paper
  #    AND Folia, keeps only versions >= MIN_MC_VERSION that currently
  #    have a STABLE build (plus the pinned 1.21.9 leg, which is ALPHA-only
  #    - see generate-matrix.sh), and emits
  #    {"include":[{server_type,mc_version,channel}, ...]} for the
  #    smoke-test job below to consume. This is intentionally its own job
  #    (not a step inside `build`) so a Fill API hiccup shows up as its own
  #    clearly-named red X instead of being buried inside the compile
  #    job's logs.
  # ---------------------------------------------------------------------
  generate-matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Discover supported Paper + Folia versions
        id: matrix
        env:
          MIN_VERSION: ${{ env.MIN_MC_VERSION }}
          UA: anarchy-phantoms-ci/1.0 (https://github.com/${{ github.repository }})
        run: |
          set -euo pipefail
          MATRIX_JSON="$(bash .github/workflows/scripts/generate-matrix.sh)"
          echo "Generated matrix:"
          echo "$MATRIX_JSON" | jq .
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 3. Fan out: one job per (server_type, mc_version, channel) triple from
  #    the discovered matrix. Each leg downloads the SAME jar built once in
  #    `build` above (never rebuilds it) and boots it against that leg's
  #    server type/version, resolving a build on that leg's specific
  #    channel (STABLE for everything discovered dynamically; ALPHA for
  #    the pinned 1.21.9 leg - see generate-matrix.sh).
  # ---------------------------------------------------------------------
  smoke-test:
    needs: [build, generate-matrix]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Paper/Folia 26.x require Java 25+ to boot at all; the runner's
      # default JDK is older (class file version 61 = Java 17) and can't
      # even load jars compiled with newer JDKs (class file version 65 =
      # Java 21), which is what 1.21.x server jars are built with. Without
      # this step every leg dies before the plugin gets a chance to load -
      # a newer JDK than any target server strictly needs is harmless
      # since the JVM runs older-targeted bytecode fine.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download jar artifact
        uses: actions/download-artifact@v7
        with:
          name: jar-${{ needs.build.outputs.short_sha }}
          path: dist

      - name: Smoke test on ${{ matrix.server_type }} ${{ matrix.mc_version }} (${{ matrix.channel }})
        id: smoke
        env:
          SERVER_TYPE: ${{ matrix.server_type }}
          TARGET_MC_VERSION: ${{ matrix.mc_version }}
          TARGET_CHANNEL: ${{ matrix.channel }}
          JAR_PATH: dist/${{ needs.build.outputs.jar_name }}
        run: bash .github/workflows/scripts/smoke-test.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log-${{ matrix.server_type }}-${{ matrix.mc_version }}-${{ needs.build.outputs.short_sha }}
          path: |
            ${{ runner.temp }}/smoketest/logs/latest.log
            ${{ runner.temp }}/smoketest/console.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 4. Publish only after every smoke-test leg (Paper AND Folia, every
  #    discovered version) has passed. Re-downloads the same jar built in
  #    step 1 rather than rebuilding — publishing must ship literally the
  #    bytes that were tested, not a fresh compile of possibly-changed
  #    source (irrelevant here since it's the same commit, but keeps the
  #    "test what you ship" invariant explicit).
  # ---------------------------------------------------------------------
  publish:
    needs: [build, smoke-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v7
        with:
          name: jar-${{ needs.build.outputs.short_sha }}
          path: dist

      - name: Prepare latest-named copy
        id: latest
        run: |
          set -euo pipefail
          cp "dist/${{ needs.build.outputs.jar_name }}" "dist/anarchy-phantoms-latest.jar"
          cp "dist/${{ needs.build.outputs.jar_name }}.sha256" "dist/anarchy-phantoms-latest.jar.sha256"
          echo "path=dist/anarchy-phantoms-latest.jar" >> "$GITHUB_OUTPUT"
          echo "digest_path=dist/anarchy-phantoms-latest.jar.sha256" >> "$GITHUB_OUTPUT"

      # Both the jar and its .sha256 digest are attached to every release.
      # PluginUpdater requires the digest asset to be present and to verify
      # before it will stage anything - a release with a jar but no matching
      # digest is treated as untrustworthy, same as a checksum mismatch.
      - name: Publish per-commit release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: git-${{ needs.build.outputs.short_sha }}
          name: Build ${{ needs.build.outputs.short_sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            This is a permanent, immutable release for this specific commit.
            Smoke-tested against Paper and Folia, all supported versions >= ${{ env.MIN_MC_VERSION }}
            (Paper 1.21.9 included via its pinned ALPHA build - Paper never shipped a STABLE
            build for that version).
            SHA-256: `${{ needs.build.outputs.jar_sha256 }}`
          prerelease: true
          make_latest: false
          files: |
            dist/${{ needs.build.outputs.jar_name }}
            dist/${{ needs.build.outputs.jar_name }}.sha256

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build (${{ needs.build.outputs.short_sha }})
          body: |
            Automated build from commit ${{ github.sha }}.
            This tag/release is overwritten on every push to `main` - only
            the newest jar is kept here. For older builds, see the
            per-commit `git-<sha>` releases.
            SHA-256: `${{ needs.build.outputs.jar_sha256 }}`
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.latest.outputs.path }}
            ${{ steps.latest.outputs.digest_path }}